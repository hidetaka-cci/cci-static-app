version: 2.1

orbs:
  node: circleci/node@7.0.0
  gh: circleci/github-cli@1.0.0

jobs:
  build:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  deploy:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - gh/setup
      - run:
          name: Authenticate with GitHub
          command: echo "${GITHUB_TOKEN}" | gh auth login --with-token
      - run:
          name: Deploy to GitHub Pages
          command: |
            git config --global user.email "circleci-bot@example.com"
            git config --global user.name "circleci-bot"
            
            git clone --depth 1 --branch gh-pages https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git /tmp/gh-pages
            cd /tmp/gh-pages
            rm -rf ./*
            cp -r ~/project/dist/* .
            cp ~/project/.nojekyll .
            git add -A
            git commit -m "Deploy from CircleCI [skip ci]" || echo "No changes"
            git push origin gh-pages
  type-check:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Type check
          command: npx tsc --noEmit

workflows:
  test:
    jobs:
      - type-check:
          filters:
            branches:
              ignore: gh-pages
  build-and-deploy:
    jobs:
      - build:
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main

