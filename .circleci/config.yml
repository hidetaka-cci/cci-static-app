version: 2.1

parameters:
  deploy_type:
    type: string
    default: "regular"
  target_version:
    type: string
    default: ""
  target_pipeline_number:
    type: integer
    default: 0

orbs:
  node: circleci/node@7.0.0

jobs:
  build:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build
          command: npm run build
      - run:
          name: Create versioned artifact
          command: |
            VERSION=${CIRCLE_SHA1:0:7}
            echo "Building version: ${VERSION}"
            # .nojekyllファイルをdistにコピー（存在する場合）
            if [ -f .nojekyll ]; then
              cp .nojekyll dist/
            fi
            cd dist
            zip -r ../artifact-${VERSION}.zip .
            cd ..
            echo ${VERSION} > version.txt
            # store_artifacts は glob をサポートしないため、アップロード対象をディレクトリに集約する
            # 参照: https://discuss.circleci.com/t/does-store-artifacts-support-glob/44304
            mkdir -p artifacts
            cp "artifact-${VERSION}.zip" "artifacts/artifact-${VERSION}.zip"
            cp "artifact-${VERSION}.zip" "artifacts/artifact.zip"
            cp "version.txt" "artifacts/version.txt"
      - run:
          name: Verify artifacts exist
          command: |
            set -euo pipefail
            echo "Artifacts directory contents:"
            ls -al artifacts
            test -s artifacts/artifact.zip
            test -s artifacts/version.txt
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - artifact-*.zip
            - version.txt
            - artifacts
      - store_artifacts:
          path: artifacts
          destination: artifacts
      - store_artifacts:
          path: version.txt

  deploy-production:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Extract artifact from workspace
          command: |
            # workspaceからアーティファクトファイルを探す
            ARTIFACT_FILE=$(ls artifacts/artifact.zip 2>/dev/null | head -1)
            if [ -z "${ARTIFACT_FILE}" ]; then
              ARTIFACT_FILE=$(ls artifact.zip 2>/dev/null | head -1)
            fi
            if [ -z "${ARTIFACT_FILE}" ]; then
              ARTIFACT_FILE=$(ls artifact-*.zip 2>/dev/null | head -1)
            fi
            
            if [ -z "${ARTIFACT_FILE}" ]; then
              echo "Error: Could not find artifact file in workspace"
              exit 1
            fi
            
            echo "Found artifact file: ${ARTIFACT_FILE}"
            
            # distディレクトリが既に存在する場合は削除
            if [ -d dist ]; then
              rm -rf dist
            fi
            mkdir -p dist
            
            # アーティファクトを展開
            unzip "${ARTIFACT_FILE}" -d dist
            
            # version.txtを確認
            if [ ! -f version.txt ]; then
              echo "Warning: version.txt not found, using current commit SHA"
              echo ${CIRCLE_SHA1:0:7} > version.txt
            fi
      - run:
          name: Plan deployment
          command: |
            VERSION=$(cat version.txt)
            circleci run release plan production-deploy \
              --environment-name=production \
              --component-name=cci-static-app \
              --target-version=${VERSION} \
              --namespace=default
      - run:
          name: Deploy to GitHub Pages
          command: |
            git config --global user.email "circleci-bot@example.com"
            git config --global user.name "circleci-bot"
            
            git clone --depth 1 --branch gh-pages https://${GITHUB_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git /tmp/gh-pages
            cd /tmp/gh-pages
            # .git 以外を完全に置き換える（ドットファイルも含めて消す）
            find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
            cp -r ~/project/dist/* .
            if [ -f ~/project/.nojekyll ]; then
              cp ~/project/.nojekyll .
            fi
            git add -A
            git commit -m "Deploy version $(cat ~/project/version.txt) from CircleCI [skip ci]" || echo "No changes"
            git push origin gh-pages
      - run:
          name: Update deployment status
          command: |
            circleci run release update production-deploy --status=SUCCESS
          when: on_success
      - run:
          name: Update deployment status (failure)
          command: |
            circleci run release update production-deploy --status=FAILED
          when: on_fail

  type-check:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Type check
          command: npx tsc --noEmit

  promote-production:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    parameters:
      target_version:
        type: string
        description: "Target commit SHA (short, 7 chars)"
        default: ""
      target_pipeline_number:
        type: integer
        description: "Target pipeline number to promote from (0 means auto-detect)"
        default: 0
    steps:
      - checkout
      - run:
          name: Dump pipeline.deploy values (verification)
          command: |
            # NOTE: pipeline values は config コンパイル時に埋め込まれるため、ジョブ実行時のenvとは別物
            mkdir -p promotion-debug
            {
              echo "pipeline.id=<< pipeline.id >>"
              echo "pipeline.number=<< pipeline.number >>"
              echo "pipeline.trigger_source=<< pipeline.trigger_source >>"
              echo "pipeline.deploy.environment_name=<< pipeline.deploy.environment_name >>"
              echo "pipeline.deploy.component_name=<< pipeline.deploy.component_name >>"
              echo "pipeline.deploy.namespace=<< pipeline.deploy.namespace >>"
              echo "pipeline.deploy.target_version=<< pipeline.deploy.target_version >>"
              echo "pipeline.deploy.current_version=<< pipeline.deploy.current_version >>"
              echo "pipeline.deploy.reason=<< pipeline.deploy.reason >>"
            } | tee promotion-debug/pipeline-deploy-values.txt
      - run:
          name: Download artifact for target version
          command: |
            # このstepは「失敗しても後続の store_artifacts を実行する」ため、最後に必ず exit 0 する。
            # 実際の成功/失敗は promotion-output/download_exit_code.txt に書き出し、最後のガードstepでjobをfailさせる。
            set -uo pipefail

            DEBUG_DIR="promotion-debug"
            OUT_DIR="promotion-output"
            mkdir -p "${DEBUG_DIR}" "${OUT_DIR}"

            log() {
              # shellcheck disable=SC2145
              echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] $@" | tee -a "${DEBUG_DIR}/run.log"
            }

            # 失敗時にも最低限の情報が artifact に残るようにする（機密は出さない）
            trap 'rc=$?; echo "exit_code=${rc}" > "'"${DEBUG_DIR}"'/exit.txt"; \
              { echo "CIRCLE_PIPELINE_ID=${CIRCLE_PIPELINE_ID:-}"; echo "CIRCLE_WORKFLOW_ID=${CIRCLE_WORKFLOW_ID:-}"; echo "CIRCLE_BUILD_NUM=${CIRCLE_BUILD_NUM:-}"; echo "CIRCLE_BRANCH=${CIRCLE_BRANCH:-}"; echo "CIRCLE_SHA1=${CIRCLE_SHA1:-}"; } > "'"${DEBUG_DIR}"'/circle-env.txt"; \
              printenv | grep "^CIRCLE_" | grep -Ev "TOKEN|PASS|PASSWORD|SECRET|KEY" | sort > "'"${DEBUG_DIR}"'/circle-env-all-sanitized.txt"; \
              # Artifact Promotion の参照情報が CIRCLE_ 以外で注入される可能性があるため、全環境変数もサニタイズして保存する
              # NOTE: 値を含むため、除外条件は強めにする
              printenv \
                | grep -Ev "(^|_)(TOKEN|PASS|PASSWORD|SECRET|KEY|COOKIE|AUTH|BEARER)(=|$)" \
                | grep -Ev "GITHUB_TOKEN|CIRCLE_TOKEN" \
                | sort > "'"${DEBUG_DIR}"'/env-all-sanitized.txt"; \
              # Promotion/Artifact/Deploy 関連っぽいキーだけ抜粋（値付き・サニタイズ済み）
              printenv \
                | grep -Ei "(PROMOT|PROMOTE|ARTIFACT|DEPLOY|RELEASE|MARKER|VERSION|PIPELINE)" \
                | grep -Ev "(^|_)(TOKEN|PASS|PASSWORD|SECRET|KEY|COOKIE|AUTH|BEARER)(=|$)" \
                | grep -Ev "GITHUB_TOKEN|CIRCLE_TOKEN" \
                | sort > "'"${DEBUG_DIR}"'/env-promotion-hints.txt"; \
              exit ${rc}' EXIT

            rc=0
            (
              set -euo pipefail

              # 0) 明示的に元pipeline番号が指定されている場合は、それを最優先する
              TARGET_PIPELINE_NUMBER="<< parameters.target_pipeline_number >>"

              # 1) 手動上書き（workflowから渡されたパラメータ）
              TARGET_VERSION="<< parameters.target_version >>"
              SOURCE_PIPELINE_ID=""
              SOURCE_PIPELINE_ID_CANDIDATES=""

              # 指定の pipeline number から pipeline id / commit を確定
              if [ "${TARGET_PIPELINE_NUMBER}" -gt 0 ]; then
                log "Target pipeline number specified: ${TARGET_PIPELINE_NUMBER}"
                BEST_ID=""
                NEXT_PAGE_TOKEN=""
                PAGE=0
                while [ -z "${BEST_ID}" ] && [ "${PAGE}" -lt 25 ]; do
                  if [ -n "${NEXT_PAGE_TOKEN}" ]; then
                    PIPELINE_API="https://circleci.com/api/v2/project/${CIRCLE_PROJECT_SLUG}/pipeline?page-token=${NEXT_PAGE_TOKEN}"
                  else
                    PIPELINE_API="https://circleci.com/api/v2/project/${CIRCLE_PROJECT_SLUG}/pipeline"
                  fi
                  log "Fetching pipelines from: ${PIPELINE_API}"
                  curl -fsSL -H "Circle-Token: ${CIRCLE_TOKEN}" "${PIPELINE_API}" -o "${DEBUG_DIR}/pipelines-by-number-${PAGE}.json"
                  PIPELINES_JSON="$(cat "${DEBUG_DIR}/pipelines-by-number-${PAGE}.json")"
                  BEST_ID=$(echo "${PIPELINES_JSON}" | jq -r --argjson n "${TARGET_PIPELINE_NUMBER}" '.items[]? | select((.number // -1) == $n) | .id' | head -1)
                  if [ -n "${BEST_ID}" ]; then
                    # commit_sha を拾えるなら target_version も揃える
                    if [ -z "${TARGET_VERSION}" ]; then
                      BEST_SHA=$(echo "${PIPELINES_JSON}" | jq -r --argjson n "${TARGET_PIPELINE_NUMBER}" '.items[]? | select((.number // -1) == $n) | (.vcs.revision // .trigger_parameters.github_app.commit_sha // .trigger_parameters.git.checkout_sha // empty)' | head -1)
                      if [ -n "${BEST_SHA}" ]; then
                        TARGET_VERSION="${BEST_SHA:0:7}"
                      fi
                    fi
                    PIPELINE_ID="${BEST_ID}"
                    log "Using pipeline ID from specified number: ${PIPELINE_ID}"
                    break
                  fi
                  NEXT_PAGE_TOKEN=$(echo "${PIPELINES_JSON}" | jq -r '.next_page_token // empty')
                  if [ -z "${NEXT_PAGE_TOKEN}" ]; then
                    break
                  fi
                  PAGE=$((PAGE + 1))
                done

                if [ -z "${PIPELINE_ID:-}" ]; then
                  log "Error: Could not find pipeline with number ${TARGET_PIPELINE_NUMBER}"
                  exit 1
                fi
              fi

              # 2) Artifact Promotion 起点では pipeline.parameters.target_version が空になることがあるため、
              #    現在のパイプライン情報からコミットSHA/元パイプラインIDを推測して埋める。
              #    まずは "source_pipeline_id" があればそれを優先する。
              if [ -z "${TARGET_VERSION}" ] && [ -z "${PIPELINE_ID:-}" ]; then
                if [ -z "${CIRCLE_PIPELINE_ID:-}" ]; then
                  log "Error: CIRCLE_PIPELINE_ID is not set and target_version is empty"
                  exit 1
                fi

                PIPELINE_SELF_API="https://circleci.com/api/v2/pipeline/${CIRCLE_PIPELINE_ID}"
                log "Resolving target version from current pipeline: ${PIPELINE_SELF_API}"
                curl -fsSL -H "Circle-Token: ${CIRCLE_TOKEN}" "${PIPELINE_SELF_API}" -o "${DEBUG_DIR}/pipeline-self.json"
                PIPELINE_SELF_JSON="$(cat "${DEBUG_DIR}/pipeline-self.json")"

                SOURCE_PIPELINE_ID=$(echo "${PIPELINE_SELF_JSON}" | jq -r '.trigger_parameters.source_pipeline_id // .trigger_parameters["source_pipeline_id"] // empty')
                # source_pipeline_id が無い場合でも、trigger_parameters/webhook.body に元pipeline UUID 等が含まれる可能性があるので抽出しておく
                # 例: UUIDっぽい文字列を全探索（複数ある場合は fail してユーザーに共有させる）
                SOURCE_PIPELINE_ID_CANDIDATES=$(echo "${PIPELINE_SELF_JSON}" | jq -r --arg cur "${CIRCLE_PIPELINE_ID}" '
                  [ .. | strings
                    | select(test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))
                    | select(. != $cur)
                  ] | unique | .[]
                ' || true)
                if [ -n "${SOURCE_PIPELINE_ID_CANDIDATES}" ]; then
                  printf "%s\n" "${SOURCE_PIPELINE_ID_CANDIDATES}" > "${DEBUG_DIR}/source-pipeline-id-candidates.txt"
                fi

                if [ -n "${SOURCE_PIPELINE_ID}" ]; then
                  log "Found source pipeline ID: ${SOURCE_PIPELINE_ID}"
                  echo "${SOURCE_PIPELINE_ID}" > "${DEBUG_DIR}/source-pipeline-id.txt"
                  PIPELINE_SRC_API="https://circleci.com/api/v2/pipeline/${SOURCE_PIPELINE_ID}"
                  curl -fsSL -H "Circle-Token: ${CIRCLE_TOKEN}" "${PIPELINE_SRC_API}" -o "${DEBUG_DIR}/pipeline-source.json"
                  PIPELINE_SRC_JSON="$(cat "${DEBUG_DIR}/pipeline-source.json")"
                  SOURCE_REVISION=$(echo "${PIPELINE_SRC_JSON}" | jq -r '.vcs.revision // empty')
                  if [ -n "${SOURCE_REVISION}" ]; then
                    TARGET_VERSION="${SOURCE_REVISION:0:7}"
                  fi
                fi

                # セーフティ: source_pipeline_id が無い Artifact Promotion は「どの元pipelineを昇格するか」が特定できないため危険。
                # commit からの自動探索は誤デプロイに繋がりうるので、ここでは問答無用で fail させる。
                if [ -z "${SOURCE_PIPELINE_ID}" ] && [ "${TARGET_PIPELINE_NUMBER}" -le 0 ]; then
                  if [ -n "${SOURCE_PIPELINE_ID_CANDIDATES}" ]; then
                    log "Error: source_pipeline_id is missing, but UUID candidates exist in trigger payload."
                    log "Candidates are saved to promotion-debug/source-pipeline-id-candidates.txt"
                  fi
                  log "Error: Missing source pipeline reference in Artifact Promotion trigger parameters."
                  log "This is treated as invalid/unsafe promotion request."
                  log "Fix: set pipeline parameter target_pipeline_number explicitly (e.g. 51)."
                  exit 1
                fi
              fi

              if [ -z "${TARGET_VERSION}" ]; then
                log "Error: target_version is empty. (Artifact Promotion のメタ情報からも解決できませんでした)"
                log "Hint: 手動で pipeline parameter target_version（7桁SHA）を渡してください。"
                exit 1
              fi

              log "Promoting version: ${TARGET_VERSION}"
              echo "${TARGET_VERSION}" > "${DEBUG_DIR}/target-version.txt"

              # CIRCLE_PROJECT_SLUGを構築（GitHubの場合はgh/org/repo形式）
              CIRCLE_PROJECT_SLUG="gh/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
              echo "${CIRCLE_PROJECT_SLUG}" > "${DEBUG_DIR}/project-slug.txt"

              # 指定されたコミットのパイプラインIDを取得（可能なら source_pipeline_id を直利用）
              # セーフティ: commit 探索による自動決定は誤デプロイにつながりうるため、ここでは行わない。
              PIPELINE_ID="${PIPELINE_ID:-}"
              if [ -n "${SOURCE_PIPELINE_ID}" ]; then
                PIPELINE_ID="${SOURCE_PIPELINE_ID}"
                log "Using source pipeline ID directly as pipeline ID: ${PIPELINE_ID}"
              fi

              if [ -z "${PIPELINE_ID}" ]; then
                # trigger payload 内に候補が 1つだけある場合は、それを source pipeline として採用する（CircleCIが暗黙に渡しているケース対応）
                if [ -n "${SOURCE_PIPELINE_ID_CANDIDATES}" ]; then
                  CAND_COUNT=$(printf "%s\n" "${SOURCE_PIPELINE_ID_CANDIDATES}" | wc -l | tr -d " ")
                  if [ "${CAND_COUNT}" -eq 1 ]; then
                    PIPELINE_ID=$(printf "%s\n" "${SOURCE_PIPELINE_ID_CANDIDATES}" | head -1)
                    log "Using unique UUID candidate as source pipeline ID: ${PIPELINE_ID}"
                  else
                    log "Error: Multiple UUID candidates found in trigger payload; cannot determine source pipeline safely."
                    log "Candidates are saved to promotion-debug/source-pipeline-id-candidates.txt"
                    exit 1
                  fi
                fi
              fi

              if [ -z "${PIPELINE_ID}" ]; then
                log "Error: Source pipeline is not specified."
                log "Fix: set pipeline parameter target_pipeline_number explicitly."
                exit 1
              fi

              if [ -z "${PIPELINE_ID}" ]; then
                log "Error: Could not find pipeline for commit ${TARGET_VERSION}"
                # デバッグ用: 先頭数件の候補SHAを出す（機密なし）
                  CANDIDATES=$(echo "${PIPELINES_JSON}" | jq -r '
                    def sha: (.vcs.revision // .trigger_parameters.github_app.commit_sha // .trigger_parameters.git.checkout_sha // "");
                    [.items[]?
                      | {id, trig:(.trigger.type // ""), num:(.number // ""), sha:(sha)}
                      | select(.sha != "")
                      | "\(.id) num=\(.num) trig=\(.trig) sha7=\(.sha[0:7])"
                    ] | .[0:5] | join(", ")
                  ')
                if [ -n "${CANDIDATES}" ] && [ "${CANDIDATES}" != "null" ]; then
                  log "Candidate pipelines (id sha7): ${CANDIDATES}"
                fi
                exit 1
              fi
              log "Found pipeline ID: ${PIPELINE_ID}"
              echo "${PIPELINE_ID}" > "${DEBUG_DIR}/pipeline-id.txt"

              # ワークフローIDを取得（build-and-deploy を明示的に選ぶ）
              WORKFLOW_API="https://circleci.com/api/v2/pipeline/${PIPELINE_ID}/workflow"
              curl -fsSL -H "Circle-Token: ${CIRCLE_TOKEN}" "${WORKFLOW_API}" -o "${DEBUG_DIR}/workflows.json"
              WORKFLOW_ID=$(cat "${DEBUG_DIR}/workflows.json" \
                | jq -r '.items[]? | select(.name == "build-and-deploy") | .id' | head -1)

              if [ -z "${WORKFLOW_ID}" ]; then
                log "Error: Could not find workflow build-and-deploy for pipeline ${PIPELINE_ID}"
                exit 1
              fi
              log "Found workflow ID: ${WORKFLOW_ID}"
              echo "${WORKFLOW_ID}" > "${DEBUG_DIR}/workflow-id.txt"

              # ビルドジョブの番号を取得（build を明示的に選ぶ）
              JOB_API="https://circleci.com/api/v2/workflow/${WORKFLOW_ID}/job"
              curl -fsSL -H "Circle-Token: ${CIRCLE_TOKEN}" "${JOB_API}" -o "${DEBUG_DIR}/jobs.json"
              BUILD_NUM=$(cat "${DEBUG_DIR}/jobs.json" \
                | jq -r '.items[]? | select(.name == "build") | .job_number' | head -1)

              if [ -z "${BUILD_NUM}" ]; then
                log "Error: Could not find build job in workflow ${WORKFLOW_ID}"
                exit 1
              fi
              log "Found build job number: ${BUILD_NUM}"
              echo "${BUILD_NUM}" > "${DEBUG_DIR}/build-job-number.txt"

              # アーティファクトをダウンロード
              ARTIFACTS_URL="https://circleci.com/api/v2/project/${CIRCLE_PROJECT_SLUG}/${BUILD_NUM}/artifacts"
              log "Fetching artifacts from: ${ARTIFACTS_URL}"

              curl -fsSL -H "Circle-Token: ${CIRCLE_TOKEN}" "${ARTIFACTS_URL}" -o "${DEBUG_DIR}/artifacts.json"
              ARTIFACTS_JSON="$(cat "${DEBUG_DIR}/artifacts.json")"

              # アーティファクトファイルを探す（固定名 artifact.zip を優先）
              ARTIFACT_URL=$(echo "${ARTIFACTS_JSON}" | jq -r '
                ( .items[]? | select(.path | test("artifact\\.zip$")) | .url ),
                ( .items[]? | select(.path | test("artifact-.*\\.zip$")) | .url )
              ' | head -1)

            # 見つからない場合は、artifactsディレクトリから構築
            if [ -z "${ARTIFACT_URL}" ] || [ "${ARTIFACT_URL}" = "null" ]; then
              ARTIFACTS_DIR_URL=$(echo "${ARTIFACTS_JSON}" | jq -r '.items[]? | select(.path == "artifacts") | .url' | head -1)
              if [ -n "${ARTIFACTS_DIR_URL}" ] && [ "${ARTIFACTS_DIR_URL}" != "null" ]; then
                # build側で artifacts/artifact.zip を常に作るので、まずは固定名を優先する
                ARTIFACT_URL="${ARTIFACTS_DIR_URL}/artifact.zip"
              else
                echo "Error: Could not find artifact in response"
                echo "Response: ${ARTIFACTS_JSON}"
                exit 1
              fi
            fi

              log "Downloading artifact from: ${ARTIFACT_URL}"
              echo "${ARTIFACT_URL}" > "${DEBUG_DIR}/artifact-url.txt"
              curl -fsSL -H "Circle-Token: ${CIRCLE_TOKEN}" -o "${OUT_DIR}/artifact.zip" "${ARTIFACT_URL}"

            if [ ! -f "${OUT_DIR}/artifact.zip" ] || [ ! -s "${OUT_DIR}/artifact.zip" ]; then
              log "Error: Failed to download artifact"
              exit 1
            fi

              mkdir -p dist
              unzip -o "${OUT_DIR}/artifact.zip" -d dist
              # 後続step互換のため、ルートにも version.txt を作成する
              echo "${TARGET_VERSION}" > "${OUT_DIR}/version.txt"
              cp -f "${OUT_DIR}/version.txt" version.txt
              cp -f version.txt "${DEBUG_DIR}/version.txt"
              log "Downloaded and extracted artifact OK"
            ) || rc=$?

            echo "${rc}" > "${OUT_DIR}/download_exit_code.txt"
            if [ "${rc}" -ne 0 ]; then
              log "Download step failed (rc=${rc}). Artifacts will be uploaded for debugging."
            fi
            # 後続の store_artifacts を必ず実行させるため exit 0
            exit 0
      - store_artifacts:
          path: promotion-debug
      - store_artifacts:
          path: promotion-output
      - run:
          name: Plan deployment
          command: |
            if [ -f promotion-output/download_exit_code.txt ] && [ "$(cat promotion-output/download_exit_code.txt)" != "0" ]; then
              echo "Skip plan: download failed"
              exit 0
            fi
            VERSION=$(cat version.txt)
            circleci run release plan production-deploy \
              --environment-name=production \
              --component-name=cci-static-app \
              --target-version=${VERSION} \
              --namespace=default
      - run:
          name: Deploy to GitHub Pages
          command: |
            if [ -f promotion-output/download_exit_code.txt ] && [ "$(cat promotion-output/download_exit_code.txt)" != "0" ]; then
              echo "Skip deploy: download failed"
              exit 0
            fi
            git config --global user.email "circleci-bot@example.com"
            git config --global user.name "circleci-bot"
            
            git clone --depth 1 --branch gh-pages https://${GITHUB_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git /tmp/gh-pages
            cd /tmp/gh-pages
            # promote-production（Artifact Promotion/ロールバック）では、gh-pages の内容をアーティファクトの内容に確実に一致させたい。
            # `.git` 以外を完全に置き換える（ドットファイルも含めて消す）
            find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
            cp -r ~/project/dist/* .
            if [ -f ~/project/.nojekyll ]; then
              cp ~/project/.nojekyll .
            fi
            git add -A
            # 差分が無くても push を発生させ、GitHub Pages のデプロイトリガー/整合性を担保する
            git commit --allow-empty -m "Deploy version $(cat ~/project/version.txt) from CircleCI [skip ci]"
            git push origin gh-pages
      - run:
          name: Update deployment status
          command: |
            if [ -f promotion-output/download_exit_code.txt ] && [ "$(cat promotion-output/download_exit_code.txt)" != "0" ]; then
              echo "Skip release update (success): download failed"
              exit 0
            fi
            circleci run release update production-deploy --status=SUCCESS || true
          when: on_success
      - run:
          name: Update deployment status (failure)
          command: |
            circleci run release update production-deploy --status=FAILED || true
          when: on_fail
      - run:
          name: Assert download succeeded
          command: |
            if [ -f promotion-output/download_exit_code.txt ] && [ "$(cat promotion-output/download_exit_code.txt)" != "0" ]; then
              echo "Failing job due to download failure (rc=$(cat promotion-output/download_exit_code.txt))"
              exit 1
            fi
            echo "Download OK"

workflows:
  test:
    jobs:
      - type-check:
          filters:
            branches:
              ignore: gh-pages
  build-and-deploy:
    when:
      not:
        equal: [ promote, << pipeline.parameters.deploy_type >> ]
    jobs:
      - build:
          filters:
            branches:
              only: main
      - deploy-production:
          requires:
            - build
          filters:
            branches:
              only: main
  promote:
    when:
      equal: [ promote, << pipeline.parameters.deploy_type >> ]
    jobs:
      - promote-production:
          target_version: << pipeline.parameters.target_version >>
          target_pipeline_number: << pipeline.parameters.target_pipeline_number >>

