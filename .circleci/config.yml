version: 2.1

parameters:
  deploy_type:
    type: string
    default: "regular"
  target_version:
    type: string
    default: ""

orbs:
  node: circleci/node@7.0.0

jobs:
  build:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build
          command: npm run build
      - run:
          name: Create versioned artifact
          command: |
            VERSION=${CIRCLE_SHA1:0:7}
            echo "Building version: ${VERSION}"
            # .nojekyllファイルをdistにコピー（存在する場合）
            if [ -f .nojekyll ]; then
              cp .nojekyll dist/
            fi
            cd dist
            zip -r ../artifact-${VERSION}.zip .
            cd ..
            echo ${VERSION} > version.txt
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - artifact-*.zip
            - version.txt
      - store_artifacts:
          path: artifact-*.zip
          destination: artifacts
      - store_artifacts:
          path: version.txt
          destination: artifacts

  deploy-production:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Download artifact from current build
          command: |
            # CIRCLE_PROJECT_SLUGを構築（GitHubの場合はgh/org/repo形式）
            CIRCLE_PROJECT_SLUG="gh/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            
            # 同じビルドナンバーのアーティファクトをダウンロード
            ARTIFACTS_URL="https://circleci.com/api/v2/project/${CIRCLE_PROJECT_SLUG}/${CIRCLE_BUILD_NUM}/artifacts"
            echo "Fetching artifacts from: ${ARTIFACTS_URL}"
            
            ARTIFACTS_JSON=$(curl -L -H "Circle-Token: ${CIRCLE_TOKEN}" "${ARTIFACTS_URL}")
            
            if [ -z "${ARTIFACTS_JSON}" ] || [ "${ARTIFACTS_JSON}" = "null" ]; then
              echo "Error: Could not fetch artifacts from API"
              exit 1
            fi
            
            ARTIFACT_URL=$(echo "${ARTIFACTS_JSON}" | jq -r '.items[]? | select(.path | contains("artifact-")) | .url' | head -1)
            
            if [ -z "${ARTIFACT_URL}" ] || [ "${ARTIFACT_URL}" = "null" ]; then
              echo "Error: Could not find artifact in response"
              echo "Response: ${ARTIFACTS_JSON}"
              exit 1
            fi
            
            echo "Downloading artifact from: ${ARTIFACT_URL}"
            curl -L -o artifact.zip "${ARTIFACT_URL}"
            
            unzip artifact.zip -d dist
            
            # version.txtも取得
            VERSION_URL=$(echo "${ARTIFACTS_JSON}" | jq -r '.items[]? | select(.path | contains("version.txt")) | .url' | head -1)
            
            if [ -z "${VERSION_URL}" ] || [ "${VERSION_URL}" = "null" ]; then
              echo "Warning: Could not find version.txt, using current commit SHA"
              echo ${CIRCLE_SHA1:0:7} > version.txt
            else
              curl -L -o version.txt "${VERSION_URL}"
            fi
      - run:
          name: Plan deployment
          command: |
            VERSION=$(cat version.txt)
            circleci run release plan production-deploy \
              --environment-name=production \
              --component-name=cci-static-app \
              --target-version=${VERSION} \
              --namespace=default
      - run:
          name: Deploy to GitHub Pages
          command: |
            git config --global user.email "circleci-bot@example.com"
            git config --global user.name "circleci-bot"
            
            git clone --depth 1 --branch gh-pages https://${GITHUB_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git /tmp/gh-pages
            cd /tmp/gh-pages
            rm -rf ./*
            cp -r ~/project/dist/* .
            if [ -f ~/project/.nojekyll ]; then
              cp ~/project/.nojekyll .
            fi
            git add -A
            git commit -m "Deploy version $(cat ~/project/version.txt) from CircleCI [skip ci]" || echo "No changes"
            git push origin gh-pages
      - run:
          name: Update deployment status
          command: |
            circleci run release update production-deploy --status=SUCCESS
          when: on_success
      - run:
          name: Update deployment status (failure)
          command: |
            circleci run release update production-deploy --status=FAILURE
          when: on_fail

  type-check:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Type check
          command: npx tsc --noEmit

  promote-production:
    docker:
      - image: cimg/node:20.0
    resource_class: small
    parameters:
      target_version:
        type: string
        description: "Target commit SHA (short, 7 chars)"
    steps:
      - checkout
      - run:
          name: Download artifact for target version
          command: |
            TARGET_VERSION="<< parameters.target_version >>"
            echo "Promoting version: ${TARGET_VERSION}"
            
            # CIRCLE_PROJECT_SLUGを構築（GitHubの場合はgh/org/repo形式）
            CIRCLE_PROJECT_SLUG="gh/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            
            # 指定されたコミットのパイプラインIDを取得
            PIPELINE_API="https://circleci.com/api/v2/project/${CIRCLE_PROJECT_SLUG}/pipeline?branch=main"
            echo "Fetching pipelines from: ${PIPELINE_API}"
            
            PIPELINE_ID=$(curl -H "Circle-Token: ${CIRCLE_TOKEN}" "${PIPELINE_API}" \
              | jq -r ".items[] | select(.vcs.revision | startswith(\"${TARGET_VERSION}\")) | .id" | head -1)
            
            if [ -z "${PIPELINE_ID}" ]; then
              echo "Error: Could not find pipeline for commit ${TARGET_VERSION}"
              exit 1
            fi
            echo "Found pipeline ID: ${PIPELINE_ID}"
            
            # ワークフローIDを取得
            WORKFLOW_API="https://circleci.com/api/v2/pipeline/${PIPELINE_ID}/workflow"
            WORKFLOW_ID=$(curl -H "Circle-Token: ${CIRCLE_TOKEN}" "${WORKFLOW_API}" \
              | jq -r '.items[0].id')
            
            if [ -z "${WORKFLOW_ID}" ]; then
              echo "Error: Could not find workflow for pipeline ${PIPELINE_ID}"
              exit 1
            fi
            echo "Found workflow ID: ${WORKFLOW_ID}"
            
            # ビルドジョブの番号を取得
            JOB_API="https://circleci.com/api/v2/workflow/${WORKFLOW_ID}/job"
            BUILD_NUM=$(curl -H "Circle-Token: ${CIRCLE_TOKEN}" "${JOB_API}" \
              | jq -r '.items[] | select(.name == "build") | .job_number')
            
            if [ -z "${BUILD_NUM}" ]; then
              echo "Error: Could not find build job in workflow ${WORKFLOW_ID}"
              exit 1
            fi
            echo "Found build job number: ${BUILD_NUM}"
            
            # アーティファクトをダウンロード
            ARTIFACTS_URL="https://circleci.com/api/v2/project/${CIRCLE_PROJECT_SLUG}/${BUILD_NUM}/artifacts"
            echo "Fetching artifacts from: ${ARTIFACTS_URL}"
            
            ARTIFACT_URL=$(curl -L -H "Circle-Token: ${CIRCLE_TOKEN}" "${ARTIFACTS_URL}" \
              | jq -r '.items[] | select(.path | contains("artifact-")) | .url' | head -1)
            
            if [ -z "${ARTIFACT_URL}" ]; then
              echo "Error: Could not find artifact for build ${BUILD_NUM}"
              exit 1
            fi
            
            echo "Downloading artifact from: ${ARTIFACT_URL}"
            curl -L -o artifact.zip "${ARTIFACT_URL}"
            
            unzip artifact.zip -d dist
            echo ${TARGET_VERSION} > version.txt
      - run:
          name: Plan deployment
          command: |
            VERSION=$(cat version.txt)
            circleci run release plan production-deploy \
              --environment-name=production \
              --component-name=cci-static-app \
              --target-version=${VERSION} \
              --namespace=default
      - run:
          name: Deploy to GitHub Pages
          command: |
            git config --global user.email "circleci-bot@example.com"
            git config --global user.name "circleci-bot"
            
            git clone --depth 1 --branch gh-pages https://${GITHUB_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git /tmp/gh-pages
            cd /tmp/gh-pages
            rm -rf ./*
            cp -r ~/project/dist/* .
            if [ -f ~/project/.nojekyll ]; then
              cp ~/project/.nojekyll .
            fi
            git add -A
            git commit -m "Deploy version $(cat ~/project/version.txt) from CircleCI [skip ci]" || echo "No changes"
            git push origin gh-pages
      - run:
          name: Update deployment status
          command: |
            circleci run release update production-deploy --status=SUCCESS
          when: on_success
      - run:
          name: Update deployment status (failure)
          command: |
            circleci run release update production-deploy --status=FAILURE
          when: on_fail

workflows:
  test:
    jobs:
      - type-check:
          filters:
            branches:
              ignore: gh-pages
  build-and-deploy:
    when:
      not:
        equal: [ promote, << pipeline.parameters.deploy_type >> ]
    jobs:
      - build:
          filters:
            branches:
              only: main
      - deploy-production:
          requires:
            - build
          filters:
            branches:
              only: main
  promote:
    when:
      equal: [ promote, << pipeline.parameters.deploy_type >> ]
    jobs:
      - promote-production:
          target_version: << pipeline.parameters.target_version >>

