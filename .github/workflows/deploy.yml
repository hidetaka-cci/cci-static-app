name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # ブランチ名は適宜変更してください

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
        # ここで @hono/vite-ssg によって static フォルダ等にHTMLが出力されます

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # HonoX + ssg のデフォルト出力先を指定
          # 通常は './static' または './dist' です。ビルドログを確認してください
          path: './static'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

